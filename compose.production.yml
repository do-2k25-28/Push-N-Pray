services:
  traefik:
    image: docker.io/library/traefik:v3.7.4@sha256:fcdef599e6259359833dd2e1d49f9e964f66825d69bd3dd468f51102ce013d03
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./${TRAEFIK_CONFIG_PATH}:/etc/traefik/traefik.yml:ro
      - traefik_certificates:/etc/traefik/acme
    env_file:
      - traefik.env
    networks:
      - traefik

  postgres:
    image: docker.io/library/postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - pushnpray

  ceph:
    image: quay.io/ceph/demo:latest-squid@sha256:522483cf07cfce6386b8e18a3edfa88a1b32c688dee231d0a6962b1513557723
    container_name: ceph
    hostname: ceph
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "ceph health | grep -qv 'HEALTH_ERR' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      MON_IP: 10.200.0.2
      CEPH_PUBLIC_NETWORK: 10.200.0.0/24
      NETWORK_AUTO_DETECT: 4
      CEPH_DEMO_UID: demo
      CEPH_DEMO_ACCESS_KEY: ${CEPH_DEMO_ACCESS_KEY}
      CEPH_DEMO_SECRET_KEY: ${CEPH_DEMO_SECRET_KEY}
      RGW_NAME: ceph
    volumes:
      - ceph-etc:/etc/ceph
      - ceph-lib:/var/lib/ceph
    networks:
      ceph:
        ipv4_address: 10.200.0.2

  server:
    image: ghcr.io/do-2k25-28/push-n-pray:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${PG_USER}
      DB_PASSWORD: ${PG_PASSWORD}
      DB_NAME: ${PG_DB}
      DB_PORT: 5432
      HTTP_PORT: 80
      REGISTER_TOKEN: ${REGISTER_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      TRAEFIK_NET: ${TRAEFIK_NET}
      CEPH_ENDPOINT: http://ceph:8080
    depends_on:
      postgres:
        condition: service_healthy
      ceph:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NET}"
      - "traefik.http.routers.api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - pushnpray
      - traefik
      - ceph

volumes:
  postgres:
  traefik_certificates:
  ceph-etc:
  ceph-lib:

networks:
  traefik:
    name: ${TRAEFIK_NET}
  pushnpray:
  ceph:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
