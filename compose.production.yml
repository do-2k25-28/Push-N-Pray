services:
  traefik:
    image: docker.io/library/traefik:v3.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG_PATH}:/etc/traefik/traefik.yml:ro
      - traefik_certificates:/etc/traefik/acme
    env_file:
      - traefik.env
    networks:
      - traefik

  postgres:
    image: docker.io/library/postgres:18.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - pushnpray

  server:
    image: ghcr.io/do-2k25-28/push-n-pray:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${PG_USER}
      DB_PASSWORD: ${PG_PASSWORD}
      DB_NAME: ${PG_DB}
      DB_PORT: 5432
      HTTP_PORT: 80
      TRAEFIK_NET: ${TRAEFIK_NET}
    depends_on:
      postgres:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - pushnpray

volumes:
  postgres:
  traefik_certificates:

networks:
  traefik:
    name: ${TRAEFIK_NET}
  pushnpray:
