services:
  postgres:
    image: library/postgres:18.3
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pushnpray
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432
      
  ceph:
    image: quay.io/ceph/demo:latest-squid@sha256:522483cf07cfce6386b8e18a3edfa88a1b32c688dee231d0a6962b1513557723
    container_name: ceph
    hostname: ceph
    environment:
      MON_IP: 192.168.200.2
      CEPH_PUBLIC_NETWORK: 192.168.200.0/24
      CEPH_DEMO_UID: demo
      CEPH_DEMO_ACCESS_KEY: ${ACCESS_KEY:-demo-access-key}
      CEPH_DEMO_SECRET_KEY: ${SECRET_KEY:-demo-secret-key}
      CEPH_DEMO_BUCKET: ${BUCKET:-default-bucket}
      RGW_NAME: localhost
    ports:
      - "8080:8080"   # S3-compatible RGW endpoint
      - "5000:5000"   # Ceph dashboard
    volumes:
      - ceph-etc:/etc/ceph
      - ceph-lib:/var/lib/ceph
    networks:
      ceph:
        ipv4_address: 192.168.200.2

networks:
  ceph:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  traefik:
    name: traefik

volumes:
  postgres:
  ceph-etc:
  ceph-lib:
