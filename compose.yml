services:
  postgres:
    image: library/postgres:18.3
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pushnpray
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432

  ceph:
    image: quay.io/ceph/demo:latest-squid@sha256:522483cf07cfce6386b8e18a3edfa88a1b32c688dee231d0a6962b1513557723
    container_name: ceph
    hostname: ceph
    privileged: true
    environment:
      MON_IP: 10.200.0.2
      CEPH_PUBLIC_NETWORK: 10.200.0.0/24
      NETWORK_AUTO_DETECT: 4
      CEPH_DEMO_UID: demo
      CEPH_DEMO_ACCESS_KEY: demo-access-key
      CEPH_DEMO_SECRET_KEY: demo-secret-key
      RGW_NAME: ceph
    # No ports exposed. Ceph is only reachable from project Docker networks
    # that are explicitly connected to this container at deploy time.
    volumes:
      - ceph-etc:/etc/ceph
      - ceph-lib:/var/lib/ceph
    networks:
      ceph:
        ipv4_address: 10.200.0.2

networks:
  ceph:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
  traefik:
    name: traefik*
    
volumes:
  postgres:
  ceph-etc:
  ceph-lib:
